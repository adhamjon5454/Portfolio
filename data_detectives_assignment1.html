<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Detectives - Assignment 1</title><style>body{font-family:system-ui;background:#101318;color:#eee;max-width:1200px;margin:auto;padding:24px}section{background:#181d24;border:1px solid #303743;border-radius:12px;padding:16px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:8px;border-radius:7px;border:1px solid #454e5b;background:#0f1217;color:#eee}button{cursor:pointer;background:#e8edf3;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{padding:10px;background:#101318;border-radius:8px}.muted{color:#9ca6b2}.table{overflow:auto;max-height:500px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px;border-bottom:1px solid #303743;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#242a33}</style></head><body><h1>Data Detectives — Annual Resource Review</h1><p class="muted">Reusable CSV analysis tool. Calculations are derived from the uploaded file.</p><section><input id="file" type="file" accept=".csv"><button onclick="cleanExport()">Export cleaned CSV</button><button onclick="logExport()">Export change log</button><p id="info" class="muted">No file loaded.</p></section><section><h2>T1/T2 — Preview, search, sort, filter</h2><div id="summary" class="grid"></div><p><input id="search" placeholder="Search all fields" oninput="render()"><select id="col" onchange="render()"><option value="">Filter column</option></select><input id="val" placeholder="Filter value" oninput="render()"><select id="sort" onchange="render()"><option value="">Sort column</option></select></p><div class="table"><table id="tbl"></table></div></section><section><h2>T3 — Data quality & manual edits</h2><div id="quality"></div><p class="row"><select id="editCol"></select><input id="editRow" type="number" min="1" placeholder="Row #"><input id="editVal" placeholder="New value"><button onclick="edit()">Apply edit</button></p></section><section><h2>T4 — Descriptive statistics</h2><select id="numCol" onchange="stats()"></select><div id="stats" class="grid"></div></section><section><h2>T5 — 1.5×IQR outliers</h2><select id="outCol" onchange="outliers()"></select><div id="out" class="muted"></div><canvas id="chart" width="1000" height="320" style="max-width:100%;background:#101318"></canvas></section><section><h2>T6 — Change log</h2><div id="log">No changes yet.</div></section><script>
let H=[],R=[],LOG=[];const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function parse(s){let a=[],r=[],f='',q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c=='"'){if(q&&n=='"'){f+='"';i++}else q=!q}else if(c==','&&!q){r.push(f);f=''}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))a.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x!==''))a.push(r);return a}function csv(x){x=String(x??'');return /[",\n\r]/.test(x)?'"'+x.replaceAll('"','""')+'"':x}function num(c){return R.map(r=>Number(String(r[c]??'').replaceAll(',',''))).filter(Number.isFinite)}function q(a,p){a=[...a].sort((x,y)=>x-y);if(!a.length)return NaN;let z=(a.length-1)*p,i=Math.floor(z),f=z-i;return a[i+1]===undefined?a[i]:a[i]+f*(a[i+1]-a[i])}function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}function sd(a){let m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let a=parse(rd.result);H=a[0].map(x=>x.trim());R=a.slice(1).map(r=>Object.fromEntries(H.map((h,i)=>[h,r[i]??''])));$('info').textContent=`${f.name}: ${R.length} rows × ${H.length} columns`;setup();render();quality();stats();outliers()};rd.readAsText(f)};function setup(){for(let id of ['col','sort','editCol','numCol','outCol']){let e=$(id);e.innerHTML=id==='col'||id==='sort'?'<option value="">'+(id==='col'?'Filter column':'Sort column')+'</option>':'';H.forEach(h=>{let o=document.createElement('option');o.value=o.textContent=h;e.appendChild(o)})}}function render(){let d=R.filter(r=>{let s=$('search').value.toLowerCase(),c=$('col').value,v=$('val').value.toLowerCase();return(!s||H.some(h=>String(r[h]).toLowerCase().includes(s)))&&(!c||String(r[c]).toLowerCase().includes(v))});let c=$('sort').value;if(c)d.sort((a,b)=>String(a[c]).localeCompare(String(b[c]),undefined,{numeric:true}));$('summary').innerHTML=`<div class=stat>Rows<br><b>${R.length}</b></div><div class=stat>Columns<br><b>${H.length}</b></div><div class=stat>Missing cells<br><b>${H.reduce((n,h)=>n+R.filter(r=>String(r[h]).trim()==='').length,0)}</b></div>`;$('tbl').innerHTML='<thead><tr>'+H.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>'+d.slice(0,500).map(r=>'<tr>'+H.map(h=>`<td>${esc(r[h])}</td>`).join('')+'</tr>').join('')+'</tbody>'}function quality(){let m=H.map(h=>[h,R.filter(r=>String(r[h]).trim()==='').length]).filter(x=>x[1]);let dup=H.includes('TransactionID')?R.length-new Set(R.map(r=>r.TransactionID).filter(Boolean)).size:0;$('quality').innerHTML=`Missing: ${m.length?m.map(x=>x[0]+': '+x[1]).join(', '):'none'}<br>Duplicate TransactionID values: ${dup}`}function stats(){let c=$('numCol').value,a=num(c);if(!c||!a.length){$('stats').innerHTML='Select a numeric column.';return}let s=[['Count',a.length],['Total',a.reduce((x,y)=>x+y,0)],['Mean',mean(a)],['Median',q(a,.5)],['Mode',(()=>{let m={};a.forEach(x=>m[x]=(m[x]||0)+1);return Object.entries(m).sort((x,y)=>y[1]-x[1])[0]?.[0]??'—'})()],['Minimum',Math.min(...a)],['Maximum',Math.max(...a)],['Range',Math.max(...a)-Math.min(...a)],['Population SD',sd(a)]];$('stats').innerHTML=s.map(x=>`<div class=stat>${x[0]}<br><b>${Number(x[1]).toLocaleString(undefined,{maximumFractionDigits:4})}</b></div>`).join('')}function outliers(){let c=$('outCol').value,a=num(c);if(!c||!a.length){$('out').textContent='Select a numeric column.';return}let q1=q(a,.25),q3=q(a,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr,n=a.filter(x=>x<lo||x>hi).length;$('out').textContent=`Inclusive Q1=${q1.toFixed(4)}, Q3=${q3.toFixed(4)}, IQR=${iqr.toFixed(4)}, fences=[${lo.toFixed(4)}, ${hi.toFixed(4)}], outliers=${n}.`}function edit(){let c=$('editCol').value,i=+$('editRow').value-1;if(!c||i<0||i>=R.length)return alert('Choose a column and valid row.');let old=R[i][c],nv=$('editVal').value;R[i][c]=nv;LOG.push({row:i+1,column:c,original:old,new:nv,method:'manual edit',reason:'User-specified correction'});render();quality();stats();$('log').innerHTML='<table><tr><th>Row</th><th>Column</th><th>Original</th><th>New</th><th>Method</th><th>Reason</th></tr>'+LOG.map(x=>`<tr><td>${x.row}</td><td>${esc(x.column)}</td><td>${esc(x.original)}</td><td>${esc(x.new)}</td><td>${x.method}</td><td>${x.reason}</td></tr>`).join('')+'</table>'}function dl(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()}function cleanExport(){if(!R.length)return;dl('cleaned.csv',[H.map(csv).join(','),...R.map(r=>H.map(h=>csv(r[h])).join(','))].join('\n'))}function logExport(){if(!LOG.length)return;dl('change_log.csv','Row,Column,Original,New,Method,Reason\n'+LOG.map(x=>[x.row,x.column,x.original,x.new,x.method,x.reason].map(csv).join(',')).join('\n'))}
</script></body></html>
